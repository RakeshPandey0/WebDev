<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <!-- header -->
    <header>
      <h1>Welcome to Our Website</h1>
    </header>

    <!-- navigation bar -->
    <nav class="nav-bar">
      <div class="nav-div">
        <div class="logo"><a href="#">Website</a></div>
        <ul>
          <li class="home"><a href="#">Home</a></li>
          <li class="blog"><a href="#blog">Blog</a></li>
          <li class="about"><a href="#about">About Us</a></li>
          <li class="login"><a href="#login">Login</a></li>
          <li class="signup"><a href="#signup">Sign Up</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <section>
        <h2>Login Form</h2>

        <form action="/signup" method="post">
          <fieldset>
            <legend>Personal Information</legend>

            <label for="f-name">First Name:</label>
            <input type="text" id="f-name" name="f-name" required /><br /><br />

            <label for="l-name">Last Name:</label>
            <input type="text" id="l-name" name="l-name" required /><br /><br />

            <label for="address">Address:</label>
            <input
              type="text"
              id="address"
              name="address"
              required
            /><br /><br />
          </fieldset>

          <fieldset>
            <legend>Set Credentials</legend>

            <label for="uname">Username:</label>
            <input type="email" id="uname" name="uname" required /><br /><br />

            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
            /><br /><br />
          </fieldset>

          <button type="submit">SignUp</button>
        </form>
      </section>
    </main>
  </body>
</html>
